<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="idle">
    <div class="seg" role="radiogroup" aria-label="What to record">
      <button class="opt active" data-mode="tab" role="radio" aria-checked="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        This tab
      </button>
      <button class="opt" data-mode="screen" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Screen / Window
      </button>
    </div>

    <label class="toggle">
      <input type="checkbox" id="mic">
      <span>Microphone</span>
    </label>

    <p class="hint" id="hint"></p>

    <p class="privacy-note">Video, shared audio and optional microphone audio are processed on this device and saved locally. Nothing is uploaded.</p>
    <button id="start" class="primary">Start recording</button>
  </section>

  <section id="recording" hidden>
    <div class="live"><span class="dot"></span><span id="timer">00:00</span></div>
    <button id="stop" class="stop">Stop &amp; save</button>
  </section>

  <p class="error" id="error" role="alert" hidden></p>
  <footer><a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a></footer>
  <script src="popup.js"></script>
</body>
</html>
